<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada (404) | Braseiro Caiçara</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="robots" content="noindex, follow" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #05070D;
        color: #F5E6D0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .logo {
        max-width: 140px;
        height: auto;
        margin-bottom: 32px;
      }
      .code {
        font-size: clamp(4rem, 12vw, 7rem);
        font-weight: 900;
        line-height: 1;
        color: #D9741C;
        letter-spacing: -0.04em;
        margin-bottom: 8px;
      }
      h1 {
        font-size: clamp(1.4rem, 3.5vw, 2.2rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #F5E6D0;
        margin-bottom: 16px;
      }
      p {
        font-size: clamp(1rem, 2vw, 1.15rem);
        color: rgba(245, 230, 208, 0.75);
        max-width: 44ch;
        line-height: 1.6;
        margin-bottom: 36px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 6px;
        transition: all 0.2s ease;
        min-height: 48px;
      }
      .btn-primary {
        background-color: #D9741C;
        color: #05070D;
      }
      .btn-primary:hover {
        background-color: #F5E6D0;
        color: #05070D;
      }
      .btn-outline {
        border: 1.5px solid rgba(245, 230, 208, 0.4);
        color: #F5E6D0;
      }
      .btn-outline:hover {
        border-color: #D9741C;
        color: #D9741C;
        background-color: rgba(217, 116, 28, 0.08);
      }
    </style>
  </head>
  <body>
    <a href="/" aria-label="Braseiro Caiçara - Início">
      <img src="/images/logo/logo.webp" alt="Braseiro Caiçara" class="logo" width="140" height="55" />
    </a>
    <div class="code">404</div>
    <h1>Essa brasa ainda não foi acesa</h1>
    <p>O endereço que você tentou acessar não existe ou mudou de lugar. Puxe a cadeira e volte para a nossa mesa.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Voltar ao Início</a>
      <a href="/cardapio" class="btn btn-outline">Ver Cardápio</a>
    </div>
  </body>
</html>
